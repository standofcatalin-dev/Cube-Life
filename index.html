<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game_Life</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>⚔️ GAME_LIFE</h1>
            <p id="user-name">Загрузка...</p>
        </header>

        <main>
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="label">Уровень</span>
                    <span id="stat-level" class="value">1</span>
                </div>
                <div class="stat-card">
                    <span class="label">HP</span>
                    <span id="stat-hp" class="value">100/100</span>
                </div>
                <div class="stat-card">
                    <span class="label">Золото</span>
                    <span id="stat-gold" class="value">50</span>
                </div>
                <div class="stat-card">
                    <span class="label">Атака</span>
                    <span id="stat-attack" class="value">10</span>
                </div>
            </div>

            <div id="buttons-container">
                <button class="action-btn" onclick="sendAction('shop')">🛒 Магазин</button>
                <button class="action-btn" onclick="sendAction('inventory')">🎒 Инвентарь</button>
                <button class="action-btn" onclick="sendAction('bosses')">👹 Боссы</button>
                <button class="action-btn" onclick="sendAction('daily')">🎁 Награда</button>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
