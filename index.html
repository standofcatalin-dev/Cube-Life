<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cube Life</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <div id="hud">
            <div class="hud-title">⬛ CUBE LIFE</div>
            <div class="hud-info">🌍 Мир: <span id="world-info">1 блок</span></div>
        </div>

        <div id="controls">
            <button class="ctrl-btn" 
                    ontouchstart="pressKey('left')" ontouchend="releaseKey('left')"
                    onmousedown="pressKey('left')" onmouseup="releaseKey('left')">◀</button>
            <button class="ctrl-btn" 
                    ontouchstart="pressKey('right')" ontouchend="releaseKey('right')"
                    onmousedown="pressKey('right')" onmouseup="releaseKey('right')">▶</button>
        </div>

        <div id="hint">
            ← → вращать камеру • WASD (в след. версии)
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
