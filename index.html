<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cube Life</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <div id="hud">
            <div class="hud-title">⬛ CUBE LIFE</div>
            <div class="hud-right">
                <div class="hud-info">🌍 <span id="world-info">0</span> блоков</div>
                <div class="hud-info">📷 <span id="camera-mode">3-е лицо</span></div>
            </div>
        </div>

        <button id="camera-btn" onclick="toggleCamera()">📷</button>

        <div id="inventory-bar">
            <div class="inv-slot active" onclick="selectSlot(0)">
                <span class="inv-icon">🟩</span>
                <span class="inv-label">Трава</span>
            </div>
            <div class="inv-slot" onclick="selectSlot(1)">
                <span class="inv-icon">⬜</span>
                <span class="inv-label">Камень</span>
            </div>
            <div class="inv-slot" onclick="selectSlot(2)">
                <span class="inv-icon">🟫</span>
                <span class="inv-label">Дерево</span>
            </div>
            <div class="inv-slot" onclick="selectSlot(3)">
                <span class="inv-icon">🌿</span>
                <span class="inv-label">Листва</span>
            </div>
            <div class="inv-slot" onclick="selectSlot(4)">
                <span class="inv-icon">🟤</span>
                <span class="inv-label">Земля</span>
            </div>
        </div>

        <div id="selected-block-info">
            Блок: <span id="selected-block">Трава</span>
        </div>

        <div id="controls" class="mobile-only">
            <div class="controls-left">
                <button class="ctrl-btn"
                        ontouchstart="pressKey('a')" ontouchend="releaseKey('a')">
