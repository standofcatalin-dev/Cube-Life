<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cube Life</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <div id="hud">
            <div class="hud-title">⬛ CUBE LIFE</div>
            <div class="hud-right">
                <div class="hud-info">🌍 <span id="world-info">0</span> блоков</div>
                <div class="hud-info">📷 <span id="camera-mode">3-е лицо</span></div>
            </div>
        </div>

        <button id="camera-btn" onclick="toggleCamera()">📷</button>

        <div id="selected-block-info">
            Блок: <span id="selected-block">Трава</span>
        </div>

        <div id="inventory-bar"></div>

        <div id="inventory-modal">
            <div class="inv-modal-content">
                <div class="inv-modal-header">
                    <h2>🎒 Инвентарь и Крафт</h2>
                    <button class="inv-modal-close">✖</button>
                </div>

                <div class="inv-player-preview">
                    <canvas id="player-preview" width="80" height="120"></canvas>
                    <div class="inv-player-stats">
                        <div class="inv-stat-row">
                            <span class="inv-stat-label">⭐ Уровень:</span>
                            <span class="inv-stat-value">1</span>
                        </div>
                        <div class="inv-stat-row">
                            <span class="inv-stat-label">❤️ HP:</span>
                            <span class="inv-stat-value">100/100</span>
                        </div>
                        <div class="inv-stat-row">
                            <span class="inv-stat-label">💰 Золото:</span>
                            <span class="inv-stat-value">50</span>
                        </div>
                    </div>
                </div>

                <div class="craft-section-inv">
                    <div class="craft-label">🔨 КРАФТ</div>
                    <div class="craft-grid-wrapper">
                        <div id="crafting-grid" class="craft-grid"></div>
                        <div class="craft-arrow">→</div>
                        <div id="crafting-result" class="craft-result">
                            <img id="crafting-result-img" class="inv-icon-img" alt="Результат">
                            <div id="crafting-result-name" class="craft-result-name">...</div>
                        </div>
                    </div>
                    <div class="craft-actions">
                        <button id="craft-btn" class="craft-action-btn">✨ Создать</button>
                        <button id="craft-reset-btn" class="craft-action-btn reset">🔄 Сброс</button>
                    </div>
                </div>

                <div class="craft-label">📦 БЛОКИ (нажми — добавить в крафт)</div>
                <div id="inventory-modal-grid" class="inv-modal-grid"></div>
            </div>
        </div>

        <div id="craft-notification"></div>

        <div id="controls" class="mobile-only">
            <div class="controls-left">
                <button class="ctrl-btn"
                        ontouchstart="pressKey('a')" ontouchend="releaseKey('a')">◀</button>
                <button class="ctrl-btn"
                        ontouchstart="pressKey('d')" ontouchend="releaseKey('d')">▶</button>
            </div>
            <div class="controls-right">
                <button class="ctrl-btn"
                        ontouchstart="pressKey('s')" ontouchend="releaseKey('s')">▼</button>
                <button class="ctrl-btn gas"
                        ontouchstart="pressKey('w')" ontouchend="releaseKey('w')">▲</button>
            </div>
        </div>

        <div id="action-buttons" class="mobile-only">
            <button id="break-btn" onclick="breakBlockBtn()">⛏️</button>
            <button id="place-btn" onclick="placeBlockBtn()">🧱</button>
        </div>

        <div id="hint">Y — инвентарь • Space — прыжок • Shift — присед • V — камера</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
