<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRA 3D</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <div id="hud">
            <div class="hud-item">🚗 <span id="speed">0</span> км/ч</div>
            <div class="hud-item">⭐ <span id="wanted">0</span></div>
        </div>

        <div id="mobile-controls">
            <div class="controls-left">
                <button class="ctrl-btn" 
                        ontouchstart="pressKey('a')" ontouchend="releaseKey('a')"
                        onmousedown="pressKey('a')" onmouseup="releaseKey('a')">◀</button>
                <button class="ctrl-btn" 
                        ontouchstart="pressKey('d')" ontouchend="releaseKey('d')"
                        onmousedown="pressKey('d')" onmouseup="releaseKey('d')">▶</button>
            </div>
            <div class="controls-right">
                <button class="ctrl-btn" 
                        ontouchstart="pressKey('s')" ontouchend="releaseKey('s')"
                        onmousedown="pressKey('s')" onmouseup="releaseKey('s')">▼</button>
                <button class="ctrl-btn gas" 
                        ontouchstart="pressKey('w')" ontouchend="releaseKey('w')"
                        onmousedown="pressKey('w')" onmouseup="releaseKey('w')">▲</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
