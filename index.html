<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cube Life</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <div id="hud">
            <div class="hud-title">⬛ CUBE LIFE</div>
            <div class="hud-right">
                <div class="hud-info">🌍 <span id="world-info">0</span> блоков</div>
                <div class="hud-info">📷 <span id="camera-mode">3-е лицо</span></div>
            </div>
        </div>

        <!-- Кнопка смены камеры -->
        <button id="camera-btn" onclick="toggleCamera()">📷</button>

        <!-- Управление движением (только мобильные) -->
        <div id="controls" class="mobile-only">
            <div class="controls-left">
                <button class="ctrl-btn"
                        ontouchstart="pressKey('a')" ontouchend="releaseKey('a')"
                        onmousedown="pressKey('a')" onmouseup="releaseKey('a')">◀</button>
                <button class="ctrl-btn"
                        ontouchstart="pressKey('d')" ontouchend="releaseKey('d')"
                        onmousedown="pressKey('d')" onmouseup="releaseKey('d')">▶</button>
            </div>
            <div class="controls-right">
                <button class="ctrl-btn"
                        ontouchstart="pressKey('s')" ontouchend="releaseKey('s')"
                        onmousedown="pressKey('s')" onmouseup="releaseKey('s')">▼</button>
                <button class="ctrl-btn gas"
                        ontouchstart="pressKey('w')" ontouchend="releaseKey('w')"
                        onmousedown="pressKey('w')" onmouseup="releaseKey('w')">▲</button>
            </div>
        </div>

        <!-- Кнопки ломать/ставить (только мобильные) -->
        <div id="action-buttons" class="mobile-only">
            <button id="break-btn" onclick="breakBlockBtn()">⛏️</button>
            <button id="place-btn" onclick="placeBlockBtn()">🧱</button>
        </div>

        <div id="hint">ПК: ЛКМ — поставить, ПКМ — сломать • V — камера</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
